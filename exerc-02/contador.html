<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Participantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div>
        <div class="text-center">
                <h2 class="text-center">Contador de Participantes<h2>
            <div class="card-body">
                <h3>Número de participantes:</h3>
                <br>
                <h2 id="contador" class="display-1 fw-bold text-primary">0</h2>
                <br>
                <div class="gap-2 text-center">
                    <button type="button" class="btn-solid theme-success" id="adicionar">Adicionar participante</button>
                    <button type="button" class="btn-solid theme-danger" id="remover">Remover participante</button>
                </div>
                <h4 id="mensagem"></h4>
            </div>
        </div>
    </div>
</body>
    <script src="app.js"></script>
</html>
